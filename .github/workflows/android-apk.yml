
name: Build SparkVisuals APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)

          if [ -z "$ZIP" ]; then
            echo "ERROR: ZIP archive not found in repository root."
            exit 1
          fi

          mkdir -p project
          unzip -q "$ZIP" -d project

      - name: Find and build Android project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS=$(find project -type f \( \
            -name settings.gradle \
            -o -name settings.gradle.kts \
          \) -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle or settings.gradle.kts not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")
          cd "$PROJECT_DIR"

          echo "Building project in: $PROJECT_DIR"

          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK=$(find project -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            -print -quit)

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

          cp "$APK" "$GITHUB_WORKSPACE/SparkVisuals-debug.apk"
          ls -lh "$GITHUB_WORKSPACE/SparkVisuals-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SparkVisuals-APK
          path: SparkVisuals-debug.apk
          if-no-files-found: error
          retention-days: 7
concurrency: 
