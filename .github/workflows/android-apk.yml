name: Build SparkVisuals APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n 1)
          test -n "$ZIP"
          mkdir project
          unzip -q "$ZIP" -d project
          find project -name settings.gradle -print

      - name: Build APK
        run: |
          PROJECT=$(dirname "$(find project -name settings.gradle | head -n 1)")
          cd "$PROJECT"
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SparkVisuals-APK
          path: project/**/app/build/outputs/apk/debug/app-debug.apk
